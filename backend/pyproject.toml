[project]
name = "project-backend"
version = "1.0.0"
description = "Backend API for ..."
requires-python = ">=3.15"

dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pyrefly>=1.5.0",
    "pytest-docker>=3.2.6",
    "pytest-random-order>=1.2.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6"
]

[build-system]
requires = ["uv_build>=0.13.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 120
lint.extend-select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "S",   # flake8-bandit
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]  # S101: use of assert detected

[tool.pyrefly]
preset = "strict"
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
implicit-any-lambda = false
unannotated-return = "error"
no-any-return = "error"
redundant-cast = "error"
unnecessary-comparison = "error"
deprecated = "error"
unnecessary-type-conversion = "error"
unreachable-except-clause = "error"
untyped-import = "error"

[tool.pytest.ini_options]
addopts = "-sv --random-order --capture=tee-sys"

[tool.poe.tasks]
test = "pytest tests"

format-check = "ruff format --check ."
format = "ruff format ."
lint = "ruff check . --no-cache"
lint-fix = "ruff check . --fix --no-cache"
typecheck = "pyrefly check"

static-checks.sequence = ["lint", "format-check", "typecheck"]
static-checks.ignore_fail = "return_non_zero"
